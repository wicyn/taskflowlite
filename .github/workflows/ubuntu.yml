name: Ubuntu

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: debug-asan, config: Debug, sanitizer: "ASAN" }
          - { name: debug-tsan, config: Debug, sanitizer: "TSAN" }
          - { name: release, config: Release, sanitizer: "OFF" }
    env:
      ASAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
    steps:
    - uses: actions/checkout@v4
    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }}
           -DTFL_BUILD_TESTS=ON -DTFL_SANITIZER=${{ matrix.sanitizer }}
    - name: Build
      run: cmake --build build --parallel 4
    - name: Test
      run: ctest --test-dir build --output-on-failure -LE perfile --no-tests=error
    - name: Upload failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: ubuntu-${{ matrix.name }}
        path: |
          build/**/CMakeConfigureLog.yaml
          build/**/CMakeError.log
          build/**/LastTest.log
          build/**/LastTestsFailed.log
        if-no-files-found: ignore
        retention-days: 7
