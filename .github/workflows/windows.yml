name: Windows

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: windows-2022
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: debug-asan, config: Debug, sanitizer: "ASAN" }
          - { name: release, config: Release, sanitizer: "OFF" }
    steps:
    - uses: actions/checkout@v4
    - name: Configure
      run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
           -DTFL_BUILD_TESTS=ON -DTFL_SANITIZER=${{ matrix.sanitizer }}
    - name: Build
      run: cmake --build build --config ${{ matrix.config }} --parallel 4
    - name: Prepare ASan runtime
      if: matrix.sanitizer == 'ASAN'
      shell: pwsh
      run: ./.github/scripts/asan_runtime.ps1 -BuildDirectory build
    - name: Test
      run: ctest --test-dir build -C ${{ matrix.config }} --output-on-failure -LE perfile --no-tests=error
    - name: Upload failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: windows-${{ matrix.name }}
        path: |
          build/**/CMakeConfigureLog.yaml
          build/**/CMakeError.log
          build/**/LastTest.log
          build/**/LastTestsFailed.log
        if-no-files-found: ignore
        retention-days: 7
