name: Windows

on: [push, pull_request]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # Debug + ASan
  debug-asan:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DTFL_BUILD_TESTS=ON -DTFL_SANITIZER=ASAN

    - name: Build
      run: cmake --build build --config Debug --parallel 4

    - name: Prepare ASan runtime
      shell: pwsh
      run: |
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath

        if (-not $vsPath) {
          throw "Visual Studio installation was not found."
        }

        $msvcVer = (Get-ChildItem "$vsPath\VC\Tools\MSVC" -Directory |
          Sort-Object Name -Descending |
          Select-Object -First 1).Name

        if (-not $msvcVer) {
          throw "MSVC toolset was not found."
        }

        $asanDir = "$vsPath\VC\Tools\MSVC\$msvcVer\bin\Hostx64\x64"
        $asanDlls = Get-ChildItem -Path $asanDir -Filter "clang_rt.asan*.dll" -File -ErrorAction Stop

        if (-not $asanDlls) {
          throw "ASan runtime DLLs were not found in: $asanDir"
        }

        # 将 ASan 运行库目录加入后续步骤的 PATH。
        # 测试和示例位于不同目录，统一通过 PATH 查找 DLL。
        $asanDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

        Write-Host "ASan runtime directory: $asanDir"

    - name: Test
      working-directory: build
      # 排除按文件重复测试，运行单体测试及已注册的示例。
      run: ctest -C Debug --output-on-failure -LE perfile

  # Release
  release:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configure
      run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTFL_BUILD_TESTS=ON

    - name: Build
      run: cmake --build build --config Release --parallel 4

    - name: Test
      working-directory: build
      run: ctest -C Release --output-on-failure -LE perfile
