name: CI Extras

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  config-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    # Formatting remains an optional local tool, not a CI requirement.
    - name: Test changed-file selection
      run: python3 -m unittest discover -s .github/scripts -p 'test_check_cpp.py'
    - name: Test sanitizer configuration
      run: cmake -P .github/scripts/check_build_options.cmake

  clang-tidy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install Clang
      # 使用 Ubuntu 24.04 自带仓库，不混入其他发行版的软件源。
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq clang-18 clang-tidy-18 ninja-build
    - name: Configure
      run: cmake -S . -B build -G Ninja -DCMAKE_CXX_COMPILER=clang++-18
           -DCMAKE_BUILD_TYPE=Debug -DTFL_BUILD_TESTS=ON -DTFL_BUILD_BENCHMARKS=ON
           -DCMAKE_EXPORT_COMPILE_COMMANDS=ON
    - name: Check changed translation units
      run: python3 .github/scripts/check_cpp.py tidy
    - name: Upload failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: clang-tidy
        path: |
          build/**/CMakeConfigureLog.yaml
          build/**/CMakeError.log
          build/**/LastTest.log
          build/**/LastTestsFailed.log
        if-no-files-found: ignore
        retention-days: 7

  install-test:
    name: install + consumer (${{ matrix.include-dir }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include-dir: [ include, tfl-headers ]
    steps:
    - uses: actions/checkout@v4
    - name: Configure library
      run: cmake -S . -B build/library -DCMAKE_INSTALL_PREFIX="$PWD/build/install"
           -DCMAKE_INSTALL_INCLUDEDIR=${{ matrix.include-dir }}
           -DTFL_BUILD_EXAMPLES=OFF -DTFL_BUILD_TESTS=OFF -DTFL_BUILD_BENCHMARKS=OFF
    - name: Install
      run: cmake --install build/library
    - name: Configure consumer
      run: cmake -S .github/tests/consumer -B build/consumer
           -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$PWD/build/install"
    - name: Build and run consumer
      run: |
        cmake --build build/consumer --parallel 4
        ctest --test-dir build/consumer --output-on-failure --no-tests=error
    - name: Upload failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: install-${{ matrix.include-dir }}
        path: |
          build/**/CMakeConfigureLog.yaml
          build/**/CMakeError.log
          build/**/LastTest.log
          build/**/LastTestsFailed.log
        if-no-files-found: ignore
        retention-days: 7

  benchmarks:
    name: benchmarks + subproject
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@v4
    - name: Configure as a subproject
      run: cmake -S .github/tests/consumer -B build -DCMAKE_BUILD_TYPE=Release
           -DTFL_CONSUMER_SUBPROJECT=ON -DTFL_BUILD_EXAMPLES=OFF
           -DTFL_BUILD_TESTS=ON -DTFL_BUILD_BENCHMARKS=ON -DTFL_NATIVE_ARCH=ON
    - name: Build benchmarks and consumer
      run: cmake --build build --target bench_taskflowlite bench_taskflow test_consumer --parallel 4
    - name: Run correctness smoke and consumer
      run: ctest --test-dir build -R '^(benchmark[.]|consumer$)' --output-on-failure --no-tests=error
    - name: Upload failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: benchmarks
        path: |
          build/**/CMakeConfigureLog.yaml
          build/**/CMakeError.log
          build/**/LastTest.log
          build/**/LastTestsFailed.log
        if-no-files-found: ignore
        retention-days: 7

  documentation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
    - name: Install Doxygen
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y -qq doxygen
    - name: Configure and build documentation
      run: |
        cmake -S . -B build -DTFL_BUILD_EXAMPLES=OFF -DTFL_BUILD_DOCS=ON
        cmake --build build --target GenerateDocs
    - name: Upload failure logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: documentation
        path: |
          build/**/CMakeConfigureLog.yaml
          build/**/CMakeError.log
          build/**/LastTest.log
          build/**/LastTestsFailed.log
        if-no-files-found: ignore
        retention-days: 7
