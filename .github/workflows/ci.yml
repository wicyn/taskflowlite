name: TaskflowLite CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: ${{ matrix.os }} | ${{ matrix.build_type }} | San=${{ matrix.sanitizer }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------- Ubuntu ----------
          - os: ubuntu-latest
            build_type: Release
            sanitizer: OFF
          - os: ubuntu-latest
            build_type: Debug
            sanitizer: ASAN
          - os: ubuntu-latest
            build_type: Debug
            sanitizer: TSAN

          # ---------- macOS ----------
          - os: macos-latest
            build_type: Release
            sanitizer: OFF
          - os: macos-latest
            build_type: Debug
            sanitizer: ASAN
          - os: macos-latest
            build_type: Debug
            sanitizer: TSAN

          # ---------- Windows ----------
          # Note: TSan is not supported on MSVC, so Windows only gets ASan coverage.
          - os: windows-latest
            build_type: Release
            sanitizer: OFF
          - os: windows-latest
            build_type: Debug
            sanitizer: ASAN

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure CMake
      run: >
        cmake -S . -B build
        -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
        -DTASKFLOWLITE_BUILD_TESTS=ON
        -DTASKFLOWLITE_SANITIZER=${{ matrix.sanitizer }}

    - name: Build
      run: cmake --build build --config ${{ matrix.build_type }} --parallel 4

    - name: Prepare ASan DLLs (Windows Only)
      if: matrix.os == 'windows-latest' && matrix.sanitizer == 'ASAN'
      shell: pwsh
      working-directory: ${{github.workspace}}/build
      run: |
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
        $msvcVer = (Get-ChildItem "$vsPath\VC\Tools\MSVC" | Sort-Object Name -Descending | Select-Object -First 1).Name
        $asanDir = "$vsPath\VC\Tools\MSVC\$msvcVer\bin\Hostx64\x64"
        $testExe = Get-ChildItem -Path . -Filter "TaskflowLiteTest.exe" -Recurse | Select-Object -First 1
        if ($testExe) {
            Write-Host "Found test executable at: $($testExe.DirectoryName)"
            Write-Host "Copying ASan runtime DLLs from: $asanDir"
            Copy-Item -Path "$asanDir\clang_rt.asan*.dll" -Destination $testExe.DirectoryName -Force
            Write-Host "Copy complete."
        } else {
            Write-Warning "TaskflowLiteTest.exe not found! Build step might have failed."
        }

    - name: Run Tests (Unix)
      if: matrix.os != 'windows-latest'
      working-directory: ${{github.workspace}}/build
      env:
        TSAN_OPTIONS: ${{ (matrix.sanitizer == 'TSAN') && format('suppressions={0}/tsan_suppressions.txt', github.workspace) || '' }}
        # ASan + UBSan: halt on first error, print full stack traces
        ASAN_OPTIONS: ${{ (matrix.sanitizer == 'ASAN') && 'halt_on_error=1:abort_on_error=1:print_stacktrace=1' || '' }}
        UBSAN_OPTIONS: ${{ (matrix.sanitizer == 'ASAN') && 'halt_on_error=1:print_stacktrace=1' || '' }}
      run: |
        if [ "${{ matrix.sanitizer }}" = "TSAN" ]; then
          printf '%s\n' \
            'race:Catch::RunContext' \
            'race:Catch::Detail' \
            'race:Catch::StringStreams' \
            'race:Catch::OutputRedirect' \
            'race:Catch::ConsoleReporter' \
            'race:__sanitizer::IsAccessibleMemoryRange' \
            > ${{github.workspace}}/tsan_suppressions.txt
        fi
        ctest -C ${{ matrix.build_type }} --output-on-failure

    - name: Run Tests (Windows)
      if: matrix.os == 'windows-latest'
      working-directory: ${{github.workspace}}/build
      run: ctest -C ${{ matrix.build_type }} --output-on-failure
